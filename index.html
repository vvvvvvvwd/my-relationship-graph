<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaf3e5">
  <title>一起来玩燕子</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #edf4e8;
      --card: rgba(250, 255, 248, .92);
      --ink: #26372c;
      --muted: #6d7c70;
      --line: #d8e6d5;
      --green: #4d7955;
      --green-soft: #e3efde;
      --gold: #b98645;
      --shadow: 0 16px 45px rgba(39, 68, 45, .11);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: linear-gradient(rgba(232, 243, 226, .76), rgba(228, 240, 222, .82)), url("background-photo.jpg") center / cover fixed;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button, input { font: inherit; }
    .page { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 34px 0 52px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 26px; }
    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-mark { min-width: 42px; height: 42px; display: grid; place-items: center; padding: 0 10px; border-radius: 14px; background: var(--green); color: white; font-size: 14px; letter-spacing: .04em; white-space: nowrap; box-shadow: 0 7px 18px rgba(52,117,102,.2); }
    .eyebrow { color: var(--green); font-size: 11px; font-weight: 750; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 3px 0 0; font-family: Georgia, "Songti SC", serif; font-size: clamp(23px, 4vw, 30px); font-weight: 650; letter-spacing: .02em; }
    .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .search-wrap { position: relative; flex: 1; max-width: 420px; }
    .search-icon { position: absolute; top: 50%; left: 15px; transform: translateY(-50%); color: #87918a; }
    .search { width: 100%; height: 46px; border: 1px solid var(--line); border-radius: 13px; outline: none; background: var(--card); padding: 0 14px 0 43px; color: var(--ink); box-shadow: 0 3px 10px rgba(39,54,47,.025); }
    .search:focus { border-color: #79a99b; box-shadow: 0 0 0 3px rgba(52,117,102,.11); }
    .count { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .layout { display: grid; grid-template-columns: 285px minmax(0, 1fr); gap: 16px; align-items: start; }
    .panel { border: 1px solid var(--line); border-radius: 19px; background: var(--card); box-shadow: var(--shadow); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .roster { align-self: start; max-height: calc(100vh - 40px); overflow: hidden; position: sticky; top: 20px; }
    .panel-head { padding: 20px 20px 15px; border-bottom: 1px solid #efeee8; }
    .panel-head h2 { margin: 0; font-family: Georgia, "Songti SC", serif; font-size: 18px; font-weight: 650; }
    .panel-head p { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
    .people { padding: 10px; max-height: min(70vh, 650px); overflow: auto; }
    .person-button { width: 100%; display: flex; align-items: center; gap: 11px; border: 0; border-radius: 12px; background: transparent; padding: 10px; color: var(--ink); text-align: left; cursor: pointer; }
    .person-button:hover { background: #f5f5f0; }
    .person-button[aria-pressed="true"] { background: var(--green-soft); }
    .person-button.is-focused { box-shadow: inset 0 0 0 2px var(--green); }
    .person-button.pair-first { outline: 2px solid #718fae; }
    .person-button.pair-second { outline: 2px solid #b76a74; }
    .avatar { width: 36px; height: 36px; flex: 0 0 36px; display: grid; place-items: center; overflow: hidden; border-radius: 50%; background: #e3efde; color: #4d7955; font-size: 14px; font-weight: 700; }
    .avatar img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .person-name { font-size: 14px; font-weight: 650; }
    .person-sub { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; font-weight: 400; }
    .graph-panel { min-height: 565px; display: flex; flex-direction: column; overflow: hidden; }
    .graph-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 18px 22px; border-bottom: 1px solid #efeee8; }
    .graph-actions { display:flex; flex-wrap:wrap; align-items:center; justify-content:flex-end; gap:8px; }
    .graph-button { min-height:36px; padding:0 12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--green); font-size:12px; font-weight:650; cursor:pointer; }
    .graph-button.primary { border-color:var(--green); background:var(--green); color:#fff; }
    .graph-button:disabled { opacity:.5; cursor:not-allowed; }
    .zoom-control { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:11px; font-weight:650; white-space:nowrap; }
    .zoom-control input { width:104px; height:22px; margin:0; accent-color:var(--green); cursor:pointer; }
    .zoom-value { min-width:36px; color:var(--green); text-align:right; }
    .graph-top h2 { margin: 0; font-family: Georgia, "Songti SC", serif; font-size: 18px; font-weight: 650; }
    .graph-top p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .graph-badge { color: #53786d; background: #eef5f1; border-radius: 20px; padding: 7px 10px; font-size: 11px; white-space: nowrap; }
    .pair-result { min-height:53px; padding:12px 22px; border-bottom:1px solid #efeee8; color:var(--muted); font-size:13px; line-height:1.65; }
    .pair-result strong { color:var(--ink); }
    .legend { display:flex; flex-wrap:wrap; gap:8px 15px; padding:11px 22px 0; color:var(--muted); font-size:11px; }
    .legend-item { display:inline-flex; align-items:center; gap:6px; }
    .legend-dot { width:9px; height:9px; border-radius:50%; background:var(--kind-color); }
    .canvas { position: relative; display: block; min-height: 490px; flex: 1; overflow:auto; background-image: linear-gradient(rgba(236, 245, 231, .68), rgba(236, 245, 231, .68)), radial-gradient(#d5e4d2 1px, transparent 1px); background-size: auto, 21px 21px; }
    svg.graph-svg { display:block; width:100%; height:auto; min-height:0; overflow:visible; }
    .edge { stroke:var(--edge-color,#9cab9e); stroke-width:2.8; opacity:.95; }
    .edge-label-bg { fill:rgba(250,255,248,.96); stroke:var(--edge-color,#9cab9e); stroke-width:1; }
    .edge-label { fill:#46574c; font-size:12px; font-weight:650; text-anchor:middle; dominant-baseline:central; }
    .node { cursor:pointer; outline:none; }
    .node circle.node-ring { fill:#fbfff9; stroke:#d6ded8; stroke-width:2; filter:drop-shadow(0 4px 6px rgba(39,54,47,.1)); }
    .node .node-core { fill:#e6efe2; }
    .node.selected-first circle.node-ring { stroke:#718fae; stroke-width:4; }
    .node.selected-second circle.node-ring { stroke:#b76a74; stroke-width:4; }
    .node text { fill:var(--ink); font-size:12px; font-weight:650; text-anchor:middle; dominant-baseline:central; pointer-events:none; }
    .node .node-initial { fill:var(--green); font-size:14px; font-weight:750; }
    .node .node-name { font-size:11px; font-weight:650; }
    .node.selected-focus circle.node-ring { stroke:var(--green); stroke-width:4; }
    .node-label-bg { fill:rgba(250,255,248,.96); stroke:#d8e6d5; stroke-width:1; }
    .empty-state { max-width: 380px; padding: 28px; text-align: center; }
    .empty-mark { width: 58px; height: 58px; display: grid; place-items: center; margin: 0 auto 15px; border-radius: 19px; background: var(--green-soft); color: var(--green); font-size: 27px; }
    .empty-state h3 { margin: 0 0 8px; font-family: Georgia, "Songti SC", serif; font-size: 21px; }
    .empty-state p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.8; }
    .empty-hint { display: inline-block; margin-top: 15px; border-radius: 9px; background: #f5f2e9; padding: 8px 11px; color: #806943; font-size: 11px; }
    footer { margin-top: 18px; color: #8b948e; font-size: 11px; text-align: center; }
    footer a { margin-left: 9px; color: var(--green); text-decoration: none; }
    @media (max-width: 760px) {
      .page { width: min(100% - 24px, 560px); padding-top: 22px; }
      header { align-items: flex-start; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .search-wrap { max-width: none; }
      .count { padding-left: 2px; }
      .layout { grid-template-columns: 1fr; }
      .roster { min-height:auto; max-height:none; position:static; }
      .people { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); max-height: 250px; }
      .person-button { min-width: 0; }
      .person-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .graph-panel { min-height: 430px; }
      .graph-top { align-items:flex-start; flex-direction:column; padding:16px; }
      .graph-actions { justify-content:flex-start; }
      .pair-result { padding:11px 16px; }
      .legend { padding:10px 16px 0; }
      .canvas { min-height:370px; }
      svg.graph-svg { min-height:0; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="brand">
      <div class="brand-mark" aria-hidden="true">江湖燕云</div>
        <div>
          <div class="eyebrow">WHERE WINDS MEET</div>
          <h1 id="site-title">一起来玩燕子</h1>
        </div>
      </div>
    </header>

    <div class="toolbar">
      <label class="search-wrap">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input class="search" id="search" type="search" placeholder="输入名字查找" autocomplete="off" aria-label="输入名字查找">
      </label>
      <div class="count" id="count">正在整理名单…</div>
    </div>

    <section class="layout">
      <aside class="panel roster" aria-label="江湖游侠">
        <div class="panel-head">
          <h2>江湖游侠</h2>
          <p>点名单中的一人看他的情谊林；在图谱里点两人查看称呼</p>
        </div>
        <div class="people" id="people-list"></div>
      </aside>

      <section class="panel graph-panel" aria-label="情谊林">
        <div class="graph-top">
          <div>
            <h2 id="graph-heading">总情谊图谱</h2>
            <p id="graph-subtitle">点名单中的一人看情谊林；点两人查看称呼</p>
          </div>
          <div class="graph-actions">
            <button class="graph-button primary" id="random-pair" type="button">随机选两位</button>
            <button class="graph-button" id="clear-pair" type="button">显示总图谱</button>
            <label class="zoom-control" for="graph-zoom">图谱大小
              <input id="graph-zoom" type="range" min="50" max="200" step="5" value="100" aria-label="调整图谱大小">
              <output class="zoom-value" id="graph-zoom-value" for="graph-zoom">100%</output>
            </label>
          </div>
        </div>
        <div class="pair-result" id="pair-result" aria-live="polite">在图谱里点两位侠友，查看他们之间的情谊称呼。</div>
        <div class="legend" aria-label="关系颜色说明">
          <span class="legend-item"><i class="legend-dot" style="--kind-color:#718fae"></i>师徒</span>
          <span class="legend-item"><i class="legend-dot" style="--kind-color:#b98645"></i>结义</span>
          <span class="legend-item"><i class="legend-dot" style="--kind-color:#b76a74"></i>侠缘</span>
          <span class="legend-item"><i class="legend-dot" style="--kind-color:#82957f"></i>其他</span>
        </div>
        <div class="canvas" id="canvas"></div>
      </section>
    </section>
    <footer>整理重要关系，让每个人都一目了然。<a href="admin.html">管理入口</a></footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="site-data.js?v=3"></script>
  <script>
    const savedSiteConfig = window.SITE_CONFIG || {};
    const site = {
      title: savedSiteConfig.title || "一起来玩燕子",
      supabaseUrl: savedSiteConfig.supabaseUrl || "https://yncppbbaexylbkqzajll.supabase.co",
      supabasePublishableKey: savedSiteConfig.supabasePublishableKey || "sb_publishable_1sMcCTII50L3ICA6wFdIpw_O81SALES"
    };
    const people = [];
    let relationships = [];
    let peopleById = new Map();
    const list = document.getElementById("people-list");
    const canvas = document.getElementById("canvas");
    const search = document.getElementById("search");
    let pairIds = [];
    let focusedPersonId = "";
    let graphMode = "total";
    let graphZoom = 1;
    let graphResizeTimer = null;
    let database = null;

    document.title = site.title || "一起来玩燕子";
    document.getElementById("site-title").textContent = site.title || "一起来玩燕子";

    function connectDatabase() {
      if (!site.supabaseUrl || !site.supabasePublishableKey || !window.supabase) return false;
      database = window.supabase.createClient(site.supabaseUrl, site.supabasePublishableKey);
      return true;
    }

    function initials(name) {
      return Array.from(name || "?")[0] || "?";
    }

    function avatarPublicUrl(path) {
      if (!path || !database) return "";
      return database.storage.from("avatars").getPublicUrl(path).data.publicUrl;
    }

    function renderList() {
      const query = search.value.trim().toLowerCase();
      const shown = people.filter(person => (person.name || "").toLowerCase().includes(query));
      list.innerHTML = "";
      if (!shown.length) {
        list.innerHTML = `<p style="padding:12px;color:var(--muted);font-size:13px">${people.length ? "没有找到这个名字。" : "名单还没有填写。"}</p>`;
        return;
      }
      shown.forEach(person => {
        const button = document.createElement("button");
        button.className = "person-button";
        button.type = "button";
        const personId = String(person.id);
        const focused = graphMode === "person" && focusedPersonId === personId;
        button.setAttribute("aria-pressed", String(focused || pairIds.includes(personId)));
        if (focused) button.classList.add("is-focused");
        if (pairIds[0] === personId) button.classList.add("pair-first");
        if (pairIds[1] === personId) button.classList.add("pair-second");
        button.innerHTML = `<span class="avatar" aria-hidden="true"></span><span><span class="person-name"></span><span class="person-sub"></span></span>`;
        const avatar = button.querySelector(".avatar");
        if (person.avatar_path) {
          const image = document.createElement("img");
          image.src = avatarPublicUrl(person.avatar_path);
          image.alt = "";
          image.addEventListener("error", () => { avatar.textContent = initials(person.name); });
          avatar.appendChild(image);
        } else {
          avatar.textContent = initials(person.name);
        }
        button.querySelector(".person-name").textContent = person.name || "未命名";
        button.querySelector(".person-sub").textContent = person.description || "点击查看此人的情谊林";
        button.addEventListener("click", () => {
          showPersonGraph(person.id);
        });
        list.appendChild(button);
      });
    }

    function addSvgText(svg, x, y, text, className) {
      const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
      label.setAttribute("x", x);
      label.setAttribute("y", y);
      label.setAttribute("class", className);
      label.textContent = text;
      svg.appendChild(label);
    }

    function projectToSegment(point, start, end) {
      const dx = end.x - start.x, dy = end.y - start.y;
      const lengthSquared = dx * dx + dy * dy || 1;
      const t = Math.max(0, Math.min(1, ((point.x - start.x) * dx + (point.y - start.y) * dy) / lengthSquared));
      const x = start.x + t * dx, y = start.y + t * dy;
      return { x, y, t, distance: Math.hypot(point.x - x, point.y - y) };
    }
    function segmentsCross(a, b, c, d) {
      const cross = (x1, y1, x2, y2) => x1 * y2 - y1 * x2;
      const rx = b.x - a.x, ry = b.y - a.y;
      const sx = d.x - c.x, sy = d.y - c.y;
      const denominator = cross(rx, ry, sx, sy);
      if (Math.abs(denominator) < .001) return null;
      const qx = c.x - a.x, qy = c.y - a.y;
      const t = cross(qx, qy, sx, sy) / denominator;
      const u = cross(qx, qy, rx, ry) / denominator;
      return t > .025 && t < .975 && u > .025 && u < .975 ? { t, u } : null;
    }

    const kindColors = { "师徒": "#718fae", "结义": "#b98645", "侠缘": "#b76a74", "其他": "#82957f" };
    function relationshipKind(edge) {
      if (["师徒", "结义", "侠缘"].includes(edge.kind)) return edge.kind;
      const labels = `${edge.label_from || ""} ${edge.label_to || ""}`;
      if (/(师傅|师父|师尊|恩师|师长|徒弟|徒儿|弟子|门下|师兄|师姐|师弟|师妹|师伯|师叔|师姑|师祖)/.test(labels)) return "师徒";
      if (/(结义|义兄|义弟|义姐|义妹)/.test(labels)) return "结义";
      if (/(侠缘|情缘)/.test(labels)) return "侠缘";
      return "其他";
    }
    function edgeForPair(firstId, secondId) {
      return relationships.filter(edge =>
        (String(edge.from_id) === firstId && String(edge.to_id) === secondId) ||
        (String(edge.from_id) === secondId && String(edge.to_id) === firstId)
      );
    }
    function teacherEdges() {
      const teachers = [];
      const teacherWords = /(师傅|师父|师尊|恩师|师长)/;
      const studentWords = /(徒弟|徒儿|弟子|门下)/;
      const add = (masterId, studentId) => {
        if (masterId && studentId && String(masterId) !== String(studentId)) teachers.push({ masterId: String(masterId), studentId: String(studentId) });
      };
      relationships.forEach(edge => {
        if (edge.kind === "师徒") {
          add(edge.from_id, edge.to_id);
          return;
        }
        const fromCallsTo = String(edge.label_from || "");
        const toCallsFrom = String(edge.label_to || "");
        const directions = [];
        if (teacherWords.test(fromCallsTo)) directions.push([edge.to_id, edge.from_id]);
        else if (studentWords.test(fromCallsTo)) directions.push([edge.from_id, edge.to_id]);
        if (teacherWords.test(toCallsFrom)) directions.push([edge.from_id, edge.to_id]);
        else if (studentWords.test(toCallsFrom)) directions.push([edge.to_id, edge.from_id]);
        const uniqueDirections = [...new Map(directions.map(([masterId, studentId]) => [`${masterId}:${studentId}`, [masterId, studentId]])).values()];
        if (uniqueDirections.length === 1) add(uniqueDirections[0][0], uniqueDirections[0][1]);
      });
      return [...new Map(teachers.map(edge => [`${edge.masterId}:${edge.studentId}`, edge])).values()];
    }
    function teacherDistance(fromId, toId, edges) {
      const next = new Map();
      edges.forEach(edge => {
        if (!next.has(edge.masterId)) next.set(edge.masterId, []);
        next.get(edge.masterId).push(edge.studentId);
      });
      const queue = [[String(fromId), 0]];
      const seen = new Set([String(fromId)]);
      while (queue.length) {
        const [personId, distance] = queue.shift();
        if (personId === String(toId)) return distance;
        (next.get(personId) || []).forEach(studentId => {
          if (seen.has(studentId)) return;
          seen.add(studentId);
          queue.push([studentId, distance + 1]);
        });
      }
      return -1;
    }
    function teachersAbove(personId, edges) {
      const previous = new Map();
      edges.forEach(edge => {
        if (!previous.has(edge.studentId)) previous.set(edge.studentId, []);
        previous.get(edge.studentId).push(edge.masterId);
      });
      const distances = new Map();
      const queue = [[String(personId), 0]];
      const seen = new Set([String(personId)]);
      while (queue.length) {
        const [studentId, distance] = queue.shift();
        (previous.get(studentId) || []).forEach(masterId => {
          if (seen.has(masterId)) return;
          seen.add(masterId);
          distances.set(masterId, distance + 1);
          queue.push([masterId, distance + 1]);
        });
      }
      return distances;
    }
    function inferTraditionalAddress(firstId, secondId) {
      const edges = teacherEdges();
      const first = peopleById.get(firstId);
      const second = peopleById.get(secondId);
      const firstToSecond = teacherDistance(firstId, secondId, edges);
      const secondToFirst = teacherDistance(secondId, firstId, edges);
      if (firstToSecond > 0) {
        const address = firstToSecond === 1 ? "师傅" : firstToSecond === 2 ? "师祖" : "师门长辈";
        return `${escapeHtml(second?.name || "人物")} 可尊称 ${escapeHtml(first?.name || "人物")} 为“${address}”。`;
      }
      if (secondToFirst > 0) {
        const address = secondToFirst === 1 ? "师傅" : secondToFirst === 2 ? "师祖" : "师门长辈";
        return `${escapeHtml(first?.name || "人物")} 可尊称 ${escapeHtml(second?.name || "人物")} 为“${address}”。`;
      }
      const firstAncestors = teachersAbove(firstId, edges);
      const secondAncestors = teachersAbove(secondId, edges);
      const shared = [...firstAncestors.keys()]
        .filter(id => secondAncestors.has(id))
        .sort((a, b) => firstAncestors.get(a) + secondAncestors.get(a) - firstAncestors.get(b) - secondAncestors.get(b));
      if (shared.length) {
        const common = shared[0];
        const firstDistance = firstAncestors.get(common);
        const secondDistance = secondAncestors.get(common);
        if (firstDistance === secondDistance) {
          return "根据已登记的师徒线索，两人属于同一辈分的同门，可礼貌称“同门”；具体师兄、师姐、师弟或师妹要看入门先后和性别。";
        }
        const senior = firstDistance < secondDistance ? first : second;
        const junior = firstDistance < secondDistance ? second : first;
        return `根据已登记的师徒线索，${escapeHtml(senior?.name || "一方")} 属师门长辈，${escapeHtml(junior?.name || "另一方")} 可尊称对方“师门长辈”；具体师伯、师叔或师姑要看辈分排序和性别。`;
      }
      return "没有足够的师门线索推断辈分；按江湖礼数，两人可互称“侠友”。";
    }
    function describePair() {
      const result = document.getElementById("pair-result");
      if (pairIds.length === 0) {
        if (graphMode === "person") {
          const focused = peopleById.get(focusedPersonId);
          result.innerHTML = `正在查看 <strong>${escapeHtml(focused?.name || "这位侠友")}</strong> 的情谊林；点“显示总图谱”返回全员图谱。`;
        } else {
          result.textContent = "在图谱里点两位侠友，查看他们之间的情谊称呼。";
        }
        return;
      }
      const first = peopleById.get(pairIds[0]);
      if (pairIds.length === 1) {
        result.innerHTML = `<strong>${escapeHtml(first?.name || "这位侠友")}</strong> 已选好，再点另一位侠友。`;
        return;
      }
      const second = peopleById.get(pairIds[1]);
      const found = edgeForPair(pairIds[0], pairIds[1]);
      if (!found.length) {
        result.innerHTML = `<strong>${escapeHtml(first?.name || "人物")}</strong> 和 <strong>${escapeHtml(second?.name || "人物")}</strong>：没有直接记录的情谊。${inferTraditionalAddress(pairIds[0], pairIds[1])}`;
        return;
      }
      const descriptions = found.map(edge => {
        const kind = relationshipKind(edge);
        if (kind === "师徒") {
          const ids = [String(edge.from_id), String(edge.to_id)];
          const lineage = teacherEdges().find(item => ids.includes(item.masterId) && ids.includes(item.studentId));
          if (lineage) {
            const master = peopleById.get(lineage.masterId);
            const disciple = peopleById.get(lineage.studentId);
            return `${escapeHtml(master?.name || "人物")} 是师傅，${escapeHtml(disciple?.name || "人物")} 是徒弟`;
          }
          const fromName = peopleById.get(String(edge.from_id))?.name || "人物 A";
          const toName = peopleById.get(String(edge.to_id))?.name || "人物 B";
          const labels = [];
          if (edge.label_from) labels.push(`${escapeHtml(fromName)} 称 ${escapeHtml(toName)} 为“${escapeHtml(edge.label_from)}”`);
          if (edge.label_to) labels.push(`${escapeHtml(toName)} 称 ${escapeHtml(fromName)} 为“${escapeHtml(edge.label_to)}”`);
          return labels.join("；") || "师门情谊";
        }
        if (kind === "其他") {
          const fromName = peopleById.get(String(edge.from_id))?.name || "人物 A";
          const toName = peopleById.get(String(edge.to_id))?.name || "人物 B";
          const parts = [];
          if (edge.label_from) parts.push(`${escapeHtml(fromName)} 称 ${escapeHtml(toName)} 为“${escapeHtml(edge.label_from)}”`);
          if (edge.label_to) parts.push(`${escapeHtml(toName)} 称 ${escapeHtml(fromName)} 为“${escapeHtml(edge.label_to)}”`);
          return parts.join("；") || "其他情谊";
        }
        return `情谊：${kind}`;
      });
      result.innerHTML = `<strong>${escapeHtml(first?.name || "人物")}</strong> 和 <strong>${escapeHtml(second?.name || "人物")}</strong>：${descriptions.join("；")}`;
    }
    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, character => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[character]));
    }
    function showPersonGraph(id) {
      graphMode = "person";
      focusedPersonId = String(id);
      pairIds = [];
      describePair();
      renderList();
      renderGraph();
    }
    function choosePairPerson(id) {
      graphMode = "total";
      focusedPersonId = "";
      const value = String(id);
      if (pairIds.includes(value)) pairIds = pairIds.filter(item => item !== value);
      else if (pairIds.length < 2) pairIds = [...pairIds, value];
      else pairIds = [pairIds[1], value];
      describePair();
      renderList();
      renderGraph();
    }

    function renderGraph() {
      canvas.innerHTML = "";
      if (!people.length) {
        document.getElementById("graph-heading").textContent = "总情谊图谱";
        document.getElementById("graph-subtitle").textContent = "等名单填好后，这里会出现全员图谱";
        document.getElementById("random-pair").disabled = true;
        canvas.innerHTML = `<div class="empty-state"><div class="empty-mark" aria-hidden="true">✦</div><h3>还没有人物资料</h3><p>网站管理员可以登录管理页面，添加人物和关系。</p><a class="empty-hint" href="admin.html">打开管理页面</a></div>`;
        return;
      }

      document.getElementById("random-pair").disabled = people.length < 2;
      const isPersonGraph = graphMode === "person";
      const center = isPersonGraph ? peopleById.get(focusedPersonId) : null;
      const displayedRelationships = isPersonGraph && center
        ? relationships.filter(edge => String(edge.from_id) === focusedPersonId || String(edge.to_id) === focusedPersonId)
        : relationships;
      let graphPeople = people;
      if (isPersonGraph && center) {
        const relatedIds = new Set(displayedRelationships.flatMap(edge => [String(edge.from_id), String(edge.to_id)]));
        relatedIds.delete(focusedPersonId);
        graphPeople = [center, ...people.filter(person => relatedIds.has(String(person.id)))];
        document.getElementById("graph-heading").textContent = `${center.name || "侠友"}的情谊林`;
        document.getElementById("graph-subtitle").textContent = displayedRelationships.length
          ? `以此人为中心 · 与 ${displayedRelationships.length} 段情谊相连`
          : "目前还没有直接记录的情谊";
      } else {
        document.getElementById("graph-heading").textContent = "总情谊图谱";
        document.getElementById("graph-subtitle").textContent = `${people.length} 位侠友 · ${relationships.length} 段情谊`;
      }
      const connectedPeople = new Set(displayedRelationships.flatMap(edge => [String(edge.from_id), String(edge.to_id)]));

      let width = Math.max(canvas.clientWidth, 760, Math.min(1500, 500 + graphPeople.length * 26));
      let height = Math.max(490, Math.min(1450, 400 + Math.sqrt(graphPeople.length) * 120));
      const n = graphPeople.length;
      const indexById = new Map(graphPeople.map((person, index) => [String(person.id), index]));
      const validEdges = displayedRelationships.filter(edge => indexById.has(String(edge.from_id)) && indexById.has(String(edge.to_id)));
      const linkedPairs = validEdges.map(edge => [indexById.get(String(edge.from_id)), indexById.get(String(edge.to_id))]);
      let forestPositions = null;
      if (!isPersonGraph) {
        const adjacency = Array.from({ length: n }, () => new Set());
        linkedPairs.forEach(([a, b]) => { if (a !== b) { adjacency[a].add(b); adjacency[b].add(a); } });
        const visited = new Set();
        const components = [];
        let isForest = true;
        for (let start = 0; start < n; start += 1) {
          if (visited.has(start)) continue;
          const parent = new Map([[start, -1]]);
          const order = [start];
          visited.add(start);
          for (let cursor = 0; cursor < order.length; cursor += 1) {
            const current = order[cursor];
            adjacency[current].forEach(next => {
              if (!visited.has(next)) {
                visited.add(next); parent.set(next, current); order.push(next);
              } else if (parent.get(current) !== next) {
                isForest = false;
              }
            });
          }
          const children = new Map(order.map(node => [node, []]));
          order.forEach(node => {
            const p = parent.get(node);
            if (p >= 0) children.get(p).push(node);
          });
          const leafCounts = new Map();
          const depths = new Map([[start, 0]]);
          for (let cursor = 0; cursor < order.length; cursor += 1) {
            const node = order[cursor];
            children.get(node).forEach(child => depths.set(child, depths.get(node) + 1));
          }
          for (let cursor = order.length - 1; cursor >= 0; cursor -= 1) {
            const node = order[cursor];
            const kids = children.get(node);
            leafCounts.set(node, kids.length ? kids.reduce((sum, child) => sum + leafCounts.get(child), 0) : 1);
          }
          components.push({ root: start, children, leafCounts, depths, width: (leafCounts.get(start) - 1) * 150 + 100, height: Math.max(...order.map(node => depths.get(node))) * 145 + 100 });
        }
        if (isForest) {
          const largestWidth = Math.max(...components.map(component => component.width));
          const packingWidth = Math.max(1200, canvas.clientWidth + 200, largestWidth + 100);
          components.sort((a, b) => b.height - a.height || b.width - a.width);
          forestPositions = Array.from({ length: n }, () => ({ x: 0, y: 0 }));
          let x = 60, y = 60, rowHeight = 0;
          components.forEach(component => {
            if (x > 60 && x + component.width > packingWidth - 40) {
              x = 60; y += rowHeight + 100; rowHeight = 0;
            }
            let leafCursor = 0;
            const place = (node, depth) => {
              const kids = component.children.get(node);
              const childXs = kids.map(child => place(child, depth + 1));
              const nodeX = childXs.length
                ? childXs.reduce((sum, childX) => sum + childX, 0) / childXs.length
                : x + 50 + leafCursor++ * 150;
              forestPositions[node] = { x: nodeX, y: y + 50 + depth * 145 };
              return nodeX;
            };
            place(component.root, 0);
            x += component.width + 70;
            rowHeight = Math.max(rowHeight, component.height);
          });
          width = Math.max(canvas.clientWidth, packingWidth);
          height = Math.max(490, y + rowHeight + 60);
        }
      }
      const fitScale = canvas.clientWidth < 760 ? 1 : Math.min(1, canvas.clientWidth / width);
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.dataset.baseWidth = String(width * fitScale);
      svg.dataset.baseHeight = String(height * fitScale);
      svg.style.width = `${width * fitScale * graphZoom}px`;
      svg.style.height = `${height * fitScale * graphZoom}px`;
      svg.classList.add("graph-svg");
      svg.setAttribute("role", "group");
      svg.setAttribute("aria-label", isPersonGraph ? `${center?.name || "侠友"}的情谊林` : "总情谊图谱，可选择两人查看关系");

      const cx = width / 2, cy = height / 2;
      const positions = forestPositions || graphPeople.map((person, index) => {
        if (isPersonGraph && index === 0) return { x: cx, y: cy };
        if (isPersonGraph) {
          const angle = -Math.PI / 2 + 2 * Math.PI * (index - 1) / Math.max(n - 1, 1);
          const radius = Math.min(width, height) * .31;
          return { x: cx + Math.cos(angle) * radius, y: cy + Math.sin(angle) * radius };
        }
        const angle = index * 2.399963229728653;
        const radius = 30 + Math.sqrt(index + 1) * Math.min(width, height) * .24;
        return { x: cx + Math.cos(angle) * radius, y: cy + Math.sin(angle) * radius };
      });
      const padding = 80;
      for (let step = 0; !isPersonGraph && !forestPositions && step < 520; step += 1) {
        const forces = positions.map(() => ({ x: 0, y: 0 }));
        for (let i = 0; i < n; i += 1) {
          for (let j = i + 1; j < n; j += 1) {
            let dx = positions[j].x - positions[i].x;
            let dy = positions[j].y - positions[i].y;
            const distance2 = Math.max(dx * dx + dy * dy, 100);
            const distance = Math.sqrt(distance2);
            const force = Math.min(2600 / distance2, 2.2);
            dx /= distance; dy /= distance;
            forces[i].x -= dx * force; forces[i].y -= dy * force;
            forces[j].x += dx * force; forces[j].y += dy * force;
          }
        }
        linkedPairs.forEach(([a, b]) => {
          const dx = positions[b].x - positions[a].x, dy = positions[b].y - positions[a].y;
          const distance = Math.max(Math.hypot(dx, dy), 1);
          const force = (distance - 180) * .008;
          forces[a].x += dx / distance * force; forces[a].y += dy / distance * force;
          forces[b].x -= dx / distance * force; forces[b].y -= dy / distance * force;
        });
        linkedPairs.forEach(([a, b]) => {
          for (let node = 0; node < n; node += 1) {
            if (node === a || node === b) continue;
            const point = positions[node];
            const projection = projectToSegment(point, positions[a], positions[b]);
            if (projection.distance >= 72) continue;
            let dx = point.x - projection.x, dy = point.y - projection.y;
            let distance = projection.distance;
            if (distance < .001) {
              const edgeX = positions[b].x - positions[a].x, edgeY = positions[b].y - positions[a].y;
              distance = 1;
              dx = -edgeY / Math.max(Math.hypot(edgeX, edgeY), 1);
              dy = edgeX / Math.max(Math.hypot(edgeX, edgeY), 1);
              if ((node + a + b) % 2) { dx *= -1; dy *= -1; }
            } else {
              dx /= distance; dy /= distance;
            }
            const force = Math.min(8, (72 - projection.distance) * .15);
            forces[node].x += dx * force;
            forces[node].y += dy * force;
            forces[a].x -= dx * force * (1 - projection.t) * .55;
            forces[a].y -= dy * force * (1 - projection.t) * .55;
            forces[b].x -= dx * force * projection.t * .55;
            forces[b].y -= dy * force * projection.t * .55;
          }
        });
        for (let firstEdge = 0; firstEdge < linkedPairs.length; firstEdge += 1) {
          for (let secondEdge = firstEdge + 1; secondEdge < linkedPairs.length; secondEdge += 1) {
            const [a, b] = linkedPairs[firstEdge];
            const [c, d] = linkedPairs[secondEdge];
            if ([a, b].some(node => node === c || node === d)) continue;
            const crossing = segmentsCross(positions[a], positions[b], positions[c], positions[d]);
            if (!crossing) continue;
            const edgeX = positions[b].x - positions[a].x, edgeY = positions[b].y - positions[a].y;
            const edgeLength = Math.max(Math.hypot(edgeX, edgeY), 1);
            const normalX = -edgeY / edgeLength, normalY = edgeX / edgeLength;
            const firstMidX = (positions[a].x + positions[b].x) / 2;
            const firstMidY = (positions[a].y + positions[b].y) / 2;
            const secondMidX = (positions[c].x + positions[d].x) / 2;
            const secondMidY = (positions[c].y + positions[d].y) / 2;
            const side = (secondMidX - firstMidX) * normalX + (secondMidY - firstMidY) * normalY;
            const sign = Math.abs(side) < .001 ? ((firstEdge + secondEdge) % 2 ? 1 : -1) : side > 0 ? 1 : -1;
            const force = 16;
            const pushFirstX = -normalX * sign * force;
            const pushFirstY = -normalY * sign * force;
            const pushSecondX = normalX * sign * force;
            const pushSecondY = normalY * sign * force;
            forces[a].x += pushFirstX * (1 - crossing.t); forces[a].y += pushFirstY * (1 - crossing.t);
            forces[b].x += pushFirstX * crossing.t; forces[b].y += pushFirstY * crossing.t;
            forces[c].x += pushSecondX * (1 - crossing.u); forces[c].y += pushSecondY * (1 - crossing.u);
            forces[d].x += pushSecondX * crossing.u; forces[d].y += pushSecondY * crossing.u;
          }
        }
        const cooling = .62 * (1 - step / 260);
        positions.forEach((point, index) => {
          point.x += (forces[index].x + (width / 2 - point.x) * .002) * cooling;
          point.y += (forces[index].y + (height / 2 - point.y) * .002) * cooling;
          point.x = Math.max(padding, Math.min(width - padding, point.x));
          point.y = Math.max(padding, Math.min(height - padding, point.y));
        });
      }

      validEdges.forEach(edge => {
        const fromIndex = indexById.get(String(edge.from_id));
        const toIndex = indexById.get(String(edge.to_id));
        const from = positions[fromIndex], to = positions[toIndex];
        const kind = relationshipKind(edge);
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", from.x); line.setAttribute("y1", from.y);
        line.setAttribute("x2", to.x); line.setAttribute("y2", to.y);
        line.setAttribute("class", "edge");
        line.style.setProperty("--edge-color", kindColors[kind]);
        svg.appendChild(line);
        const mx = (from.x + to.x) / 2, my = (from.y + to.y) / 2;
        const label = ["师徒", "结义", "侠缘"].includes(edge.kind) ? kind : (edge.label_from || kind);
        const labelWidth = Math.max(42, Array.from(label).length * 13 + 18);
        const bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        bg.setAttribute("x", mx - labelWidth / 2); bg.setAttribute("y", my - 11);
        bg.setAttribute("width", labelWidth); bg.setAttribute("height", 22);
        bg.setAttribute("rx", 11); bg.setAttribute("class", "edge-label-bg");
        bg.style.setProperty("--edge-color", kindColors[kind]);
        svg.appendChild(bg);
        addSvgText(svg, mx, my + 1, label, "edge-label");
      });

      const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
      svg.appendChild(defs);
      graphPeople.forEach((person, index) => {
        const point = positions[index];
        const personId = String(person.id);
        const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
        const selectionClass = pairIds[0] === personId ? " selected-first" : pairIds[1] === personId ? " selected-second" : isPersonGraph && index === 0 ? " selected-focus" : "";
        group.setAttribute("class", `node${selectionClass}`);
        group.setAttribute("transform", `translate(${point.x}, ${point.y})`);
        group.setAttribute("tabindex", "0");
        group.setAttribute("role", "button");
        group.setAttribute("aria-label", isPersonGraph ? `查看${person.name || "未命名"}的情谊林` : `选择${person.name || "未命名"}查看两人称呼`);
        group.addEventListener("click", () => isPersonGraph ? showPersonGraph(person.id) : choosePairPerson(person.id));
        group.addEventListener("keydown", event => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); group.click(); } });
        const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        circle.setAttribute("r", connectedPeople.has(personId) ? "25" : "21");
        circle.setAttribute("class", "node-ring");
        group.appendChild(circle);
        if (person.avatar_path) {
          const photoRadius = connectedPeople.has(personId) ? 21 : 17;
          const clipId = `avatar-clip-${index}`;
          const clip = document.createElementNS("http://www.w3.org/2000/svg", "clipPath");
          clip.setAttribute("id", clipId);
          const clipCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          clipCircle.setAttribute("r", photoRadius);
          clip.appendChild(clipCircle);
          defs.appendChild(clip);
          const image = document.createElementNS("http://www.w3.org/2000/svg", "image");
          image.setAttribute("x", -photoRadius);
          image.setAttribute("y", -photoRadius);
          image.setAttribute("width", photoRadius * 2);
          image.setAttribute("height", photoRadius * 2);
          image.setAttribute("href", avatarPublicUrl(person.avatar_path));
          image.setAttribute("preserveAspectRatio", "xMidYMid slice");
          image.setAttribute("clip-path", `url(#${clipId})`);
          group.appendChild(image);
        } else {
          const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
          text.setAttribute("class", "node-initial");
          text.textContent = initials(person.name);
          group.appendChild(text);
        }
        const name = person.name || "未命名";
        const labelWidth = Math.min(132, Math.max(46, Array.from(name).length * 12 + 16));
        const labelBg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        labelBg.setAttribute("x", -labelWidth / 2);
        labelBg.setAttribute("y", 28);
        labelBg.setAttribute("width", labelWidth);
        labelBg.setAttribute("height", 20);
        labelBg.setAttribute("rx", 10);
        labelBg.setAttribute("class", "node-label-bg");
        group.appendChild(labelBg);
        const labelText = document.createElementNS("http://www.w3.org/2000/svg", "text");
        labelText.setAttribute("class", "node-name");
        labelText.setAttribute("y", 38);
        labelText.textContent = name;
        group.appendChild(labelText);
        svg.appendChild(group);
      });
      canvas.appendChild(svg);
    }

    document.getElementById("graph-zoom").addEventListener("input", event => {
      graphZoom = Number(event.currentTarget.value) / 100;
      document.getElementById("graph-zoom-value").textContent = `${event.currentTarget.value}%`;
      const svg = canvas.querySelector("svg.graph-svg");
      if (svg) {
        svg.style.width = `${Number(svg.dataset.baseWidth) * graphZoom}px`;
        svg.style.height = `${Number(svg.dataset.baseHeight) * graphZoom}px`;
      }
    });
    window.addEventListener("resize", () => {
      clearTimeout(graphResizeTimer);
      graphResizeTimer = setTimeout(renderGraph, 120);
    });
    search.addEventListener("input", renderList);
    document.getElementById("random-pair").addEventListener("click", () => {
      if (people.length < 2) return;
      const firstIndex = Math.floor(Math.random() * people.length);
      let secondIndex = Math.floor(Math.random() * (people.length - 1));
      if (secondIndex >= firstIndex) secondIndex += 1;
      graphMode = "total";
      focusedPersonId = "";
      pairIds = [String(people[firstIndex].id), String(people[secondIndex].id)];
      describePair(); renderList(); renderGraph();
    });
    document.getElementById("clear-pair").addEventListener("click", () => {
      pairIds = [];
      focusedPersonId = "";
      graphMode = "total";
      describePair(); renderList(); renderGraph();
    });

    async function loadData() {
      if (!connectDatabase()) {
        document.getElementById("count").textContent = "网站还没有连接在线名单";
        renderList();
        renderGraph();
        return;
      }
      try {
        let [peopleResult, relationshipResult] = await Promise.all([
          database.from("people").select("id,name,description,avatar_path").order("name"),
          database.from("relationships").select("id,from_id,to_id,label_from,label_to,kind")
        ]);
        if (peopleResult.error) {
          peopleResult = await database.from("people").select("id,name,description").order("name");
        }
        if (peopleResult.error) throw peopleResult.error;
        if (relationshipResult.error) {
          relationshipResult = await database.from("relationships").select("id,from_id,to_id,label_from,label_to");
        }
        if (relationshipResult.error) throw relationshipResult.error;
        people.push(...(peopleResult.data || []));
        relationships = relationshipResult.data || [];
        peopleById = new Map(people.map(person => [String(person.id), person]));
        pairIds = [];
        focusedPersonId = "";
        graphMode = "total";
        document.getElementById("count").textContent = `共收录 ${people.length} 人`;
        describePair();
        renderList();
        renderGraph();
      } catch (error) {
        document.getElementById("count").textContent = "暂时读不到名单";
        document.getElementById("graph-heading").textContent = "情谊林暂时打不开";
        document.getElementById("graph-subtitle").textContent = "请联系网站管理员检查数据库设置";
        canvas.innerHTML = `<div class="empty-state"><div class="empty-mark" aria-hidden="true">!</div><h3>暂时无法读取资料</h3><p>在线名单还没有连好，或数据库暂时没有响应。</p></div>`;
      }
    }

    loadData();
  </script>
</body>
