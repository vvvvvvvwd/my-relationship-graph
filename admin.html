<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaf3e5">
  <title>管理人物关系图</title>
  <style>
    :root { color-scheme: light; --paper:#edf4e8; --card:rgba(250,255,248,.92); --ink:#26372c; --muted:#6d7c70; --line:#d8e6d5; --green:#4d7955; --green-soft:#e3efde; --red:#a3443c; --shadow:0 16px 45px rgba(39,68,45,.11); }
    * { box-sizing:border-box; }
    body { margin:0; background:linear-gradient(rgba(232,243,226,.76),rgba(228,240,222,.82)),url("background-photo.jpg") center/cover fixed; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
    button,input,select { font:inherit; }
    .page { width:min(920px,calc(100% - 32px)); margin:0 auto; padding:32px 0 52px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:22px; }
    .eyebrow { color:var(--green); font-size:11px; font-weight:750; letter-spacing:.15em; }
    h1 { margin:5px 0 0; font-family:Georgia,"Songti SC",serif; font-size:28px; }
    h2 { margin:0; font-family:Georgia,"Songti SC",serif; font-size:19px; }
    p { color:var(--muted); font-size:13px; line-height:1.7; }
    a { color:var(--green); text-decoration:none; font-size:13px; }
    .card { margin:14px 0; padding:22px; border:1px solid var(--line); border-radius:18px; background:var(--card); box-shadow:var(--shadow); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
    .card-heading { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:16px; }
    .card-heading p { margin:5px 0 0; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    label { display:block; color:#52615a; font-size:12px; font-weight:650; }
    input,select { width:100%; height:42px; margin-top:6px; padding:0 11px; border:1px solid var(--line); border-radius:10px; background:white; color:var(--ink); outline:none; }
    input[type="file"] { height:auto; min-height:42px; padding:7px; }
    input:focus,select:focus { border-color:#79a99b; box-shadow:0 0 0 3px rgba(52,117,102,.1); }
    .avatar-preview { display:flex; align-items:center; gap:12px; }
    .avatar-preview img,.row-avatar { width:52px; height:52px; flex:0 0 52px; border:1px solid var(--line); border-radius:50%; object-fit:cover; background:var(--green-soft); }
    .row-avatar { display:grid; place-items:center; width:36px; height:36px; flex-basis:36px; color:var(--green); font-size:13px; font-weight:700; }
    .row-avatar img { display:block; width:100%; height:100%; border-radius:50%; object-fit:cover; }
    .actions { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:14px; }
    .button { min-height:38px; padding:0 14px; border:1px solid var(--line); border-radius:10px; background:white; color:var(--ink); cursor:pointer; }
    .button.primary { border-color:var(--green); background:var(--green); color:white; }
    .button.danger { color:var(--red); }
    .button:disabled { opacity:.55; cursor:not-allowed; }
    .status { min-height:20px; margin:8px 0 0; color:var(--muted); font-size:12px; }
    .status.error { color:var(--red); }
    .row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid #efeee8; }
    .row-main { min-width:0; overflow-wrap:anywhere; font-size:13px; }
    .row-note { display:block; margin-top:4px; color:var(--muted); font-size:11px; }
    .row-note.kind-note { display:inline-block; padding:3px 8px; border-radius:20px; background:color-mix(in srgb, var(--kind-color) 12%, white); color:var(--kind-color); font-weight:700; }
    .row-actions { display:flex; flex:0 0 auto; gap:6px; }
    .row-actions .button { min-height:32px; padding:0 10px; font-size:12px; }
    .empty { padding:10px 0; color:var(--muted); font-size:13px; }
    .hidden { display:none !important; }
    @media (max-width:620px) { .page{padding-top:22px}.card{padding:17px}.grid{grid-template-columns:1fr}.row{align-items:flex-start}.row-actions{flex-direction:column} }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div><div class="eyebrow">网站管理</div><h1>管理人物关系图</h1></div>
      <a href="index.html">回到关系图 →</a>
    </header>

    <section class="card" id="login-card">
      <h2>管理员登录</h2>
      <p>只有管理员可以修改名单。访客无需登录，只能查看关系图。</p>
      <form id="login-form">
        <div class="grid">
          <label>管理员邮箱<input id="email" type="email" autocomplete="username" required></label>
          <label>密码<input id="password" type="password" autocomplete="current-password" required></label>
        </div>
        <div class="actions"><button class="button primary" type="submit">登录</button></div>
      </form>
      <p class="status" id="login-status" role="status"></p>
    </section>

    <section id="manager" class="hidden">
      <div class="card">
        <div class="card-heading"><div><h2>人物</h2><p>添加新人物，或修改已经收录的人。</p></div><button class="button" id="logout" type="button">退出登录</button></div>
        <form id="person-form">
          <input id="person-id" type="hidden">
          <div class="grid">
            <label>名字<input id="person-name" maxlength="80" required placeholder="例如：小林"></label>
            <label>简单介绍（可以不填）<input id="person-description" maxlength="180" placeholder="例如：大学同学"></label>
            <label>头像照片（JPG、PNG 或 WebP，2 MB 以内）<input id="person-avatar" class="file-input" type="file" accept="image/jpeg,image/png,image/webp"></label>
            <div id="avatar-preview" class="avatar-preview hidden"><img id="avatar-preview-image" alt="头像预览"><button class="button" id="avatar-clear" type="button">移除头像</button></div>
          </div>
          <p class="status">头像会显示在公开网站上。</p>
          <div class="actions"><button class="button primary" id="person-save" type="submit">添加人物</button><button class="button hidden" id="person-cancel" type="button">取消修改</button></div>
        </form>
        <p class="status" id="person-status" role="status"></p>
        <div id="people-rows"></div>
      </div>

      <div class="card">
        <div class="card-heading"><div><h2>情谊</h2><p>选择情谊类型，再选择相关人物。</p></div></div>
        <form id="relationship-form">
          <input id="relationship-id" type="hidden">
          <div class="grid">
            <label>情谊类型<select id="relationship-kind" required><option value="">先选情谊类型</option><option value="师徒">师徒</option><option value="结义">结义</option><option value="侠缘">侠缘</option><option value="其他">其他（自定义）</option></select></label>
            <div></div>
            <label><span id="from-person-label">师傅</span><select id="from-person" required></select></label>
            <label><span id="to-person-label">徒弟</span><select id="to-person" required></select></label>
            <label id="label-from-wrap" class="hidden">A 对 B 的称呼<input id="label-from" maxlength="60" placeholder="例如：朋友"></label>
            <label id="label-to-wrap" class="hidden">B 对 A 的称呼<input id="label-to" maxlength="60" placeholder="例如：知己（可以不填）"></label>
          </div>
          <p class="status" id="relationship-kind-help">请先选择情谊类型。</p>
          <div class="actions"><button class="button primary" id="relationship-save" type="submit">添加关系</button><button class="button hidden" id="relationship-cancel" type="button">取消修改</button></div>
        </form>
        <p class="status" id="relationship-status" role="status"></p>
        <div id="relationship-rows"></div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="site-data.js?v=3"></script>
  <script>
    const savedSiteConfig = window.SITE_CONFIG || {};
    const config = {
      supabaseUrl: savedSiteConfig.supabaseUrl || "https://yncppbbaexylbkqzajll.supabase.co",
      supabasePublishableKey: savedSiteConfig.supabasePublishableKey || "sb_publishable_1sMcCTII50L3ICA6wFdIpw_O81SALES"
    };
    const loginCard = document.getElementById("login-card");
    const manager = document.getElementById("manager");
    const loginStatus = document.getElementById("login-status");
    const peopleRows = document.getElementById("people-rows");
    const relationshipRows = document.getElementById("relationship-rows");
    const avatarInput = document.getElementById("person-avatar");
    const avatarPreview = document.getElementById("avatar-preview");
    const avatarPreviewImage = document.getElementById("avatar-preview-image");
    let database = null;
    let people = [];
    let relationships = [];
    let avatarColumnAvailable = true;
    let relationshipKindColumnAvailable = true;
    let currentAvatarPath = "";
    let selectedAvatarFile = null;
    let removeAvatarOnSave = false;
    let avatarPreviewObjectUrl = "";
    const avatarBucket = "avatars";
    const maxAvatarSize = 2 * 1024 * 1024;

    function setStatus(element, message, isError = false) {
      element.textContent = message || "";
      element.classList.toggle("error", isError);
    }

    function ready() {
      return Boolean(config.supabaseUrl && config.supabasePublishableKey && window.supabase);
    }

    function avatarPublicUrl(path) {
      if (!path || !database) return "";
      return database.storage.from(avatarBucket).getPublicUrl(path).data.publicUrl;
    }

    function hideAvatarPreview() {
      if (avatarPreviewObjectUrl) URL.revokeObjectURL(avatarPreviewObjectUrl);
      avatarPreviewObjectUrl = "";
      avatarPreviewImage.removeAttribute("src");
      avatarPreview.classList.add("hidden");
    }

    function showAvatarPreview(path = "", file = null) {
      hideAvatarPreview();
      const src = file ? URL.createObjectURL(file) : avatarPublicUrl(path);
      if (!src) return;
      if (file) avatarPreviewObjectUrl = src;
      avatarPreviewImage.src = src;
      avatarPreview.classList.remove("hidden");
    }

    function avatarFileExtension(file) {
      return ({ "image/jpeg": "jpg", "image/png": "png", "image/webp": "webp" })[file.type] || "";
    }

    function makeButton(label, className, onClick) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = `button ${className || ""}`.trim();
      button.textContent = label;
      button.addEventListener("click", onClick);
      return button;
    }

    function addRow(container, title, note, buttons = [], avatarPerson = null, kind = "") {
      const row = document.createElement("div");
      row.className = "row";
      if (avatarPerson) {
        const avatar = document.createElement("span");
        avatar.className = "row-avatar";
        if (avatarPerson.avatar_path) {
          const image = document.createElement("img");
          image.src = avatarPublicUrl(avatarPerson.avatar_path);
          image.alt = "";
          avatar.appendChild(image);
        } else {
          avatar.textContent = Array.from(avatarPerson.name || "?")[0] || "?";
        }
        row.appendChild(avatar);
      }
      const main = document.createElement("div");
      main.className = "row-main";
      main.textContent = title;
      if (note) {
        const small = document.createElement("span");
        small.className = "row-note";
        if (kind) {
          small.classList.add("kind-note");
          small.style.setProperty("--kind-color", ({"师徒":"#718fae","结义":"#b98645","侠缘":"#b76a74","其他":"#82957f"})[kind] || "#82957f");
        }
        small.textContent = note;
        main.appendChild(small);
      }
      const actions = document.createElement("div");
      actions.className = "row-actions";
      buttons.forEach(button => actions.appendChild(button));
      row.append(main, actions);
      container.appendChild(row);
    }

    function refreshPeopleSelects() {
      [document.getElementById("from-person"), document.getElementById("to-person")].forEach(select => {
        const previous = select.value;
        select.innerHTML = "";
        const first = document.createElement("option");
        first.value = "";
        first.textContent = "选择人物";
        select.appendChild(first);
        people.forEach(person => {
          const option = document.createElement("option");
          option.value = person.id;
          option.textContent = person.name;
          select.appendChild(option);
        });
        if (people.some(person => String(person.id) === previous)) select.value = previous;
      });
    }

    function selectedRelationshipKind() {
      return document.getElementById("relationship-kind").value;
    }

    function updateRelationshipFields() {
      const kind = selectedRelationshipKind();
      const fromLabel = document.getElementById("from-person-label");
      const toLabel = document.getElementById("to-person-label");
      const fromWrap = document.getElementById("label-from-wrap");
      const toWrap = document.getElementById("label-to-wrap");
      const fromInput = document.getElementById("label-from");
      const toInput = document.getElementById("label-to");
      const help = document.getElementById("relationship-kind-help");
      const custom = kind === "其他";
      fromLabel.textContent = kind === "师徒" ? "师傅" : "人物 A";
      toLabel.textContent = kind === "师徒" ? "徒弟" : "人物 B";
      fromWrap.classList.toggle("hidden", !custom);
      toWrap.classList.toggle("hidden", !custom);
      fromInput.required = custom;
      toInput.required = false;
      help.textContent = kind === "师徒" ? "人物 A 是师傅，人物 B 是徒弟，图谱会按这个方向显示。" :
        kind === "其他" ? "可以填写双方各自使用的称呼。" : kind ? `${kind}会用对应颜色显示在图谱上。` : "请先选择情谊类型。";
    }

    function renderPeople() {
      peopleRows.innerHTML = "";
      if (!people.length) {
        peopleRows.innerHTML = '<div class="empty">还没有人物，先在上面的框里添加。</div>';
        refreshPeopleSelects();
        return;
      }
      people.forEach(person => {
        const edit = makeButton("修改", "", () => {
          document.getElementById("person-id").value = person.id;
          document.getElementById("person-name").value = person.name;
          document.getElementById("person-description").value = person.description || "";
          currentAvatarPath = person.avatar_path || "";
          selectedAvatarFile = null;
          removeAvatarOnSave = false;
          avatarInput.value = "";
          showAvatarPreview(currentAvatarPath);
          document.getElementById("person-save").textContent = "保存修改";
          document.getElementById("person-cancel").classList.remove("hidden");
          document.getElementById("person-name").focus();
        });
        const remove = makeButton("删除", "danger", async () => {
          if (!confirm(`要删除“${person.name}”吗？与这个人的关系也会一起删除。`)) return;
          if (person.avatar_path) {
            const { error: avatarError } = await database.storage.from(avatarBucket).remove([person.avatar_path]);
            if (avatarError) return setStatus(document.getElementById("person-status"), "头像删除失败，请稍后再试。", true);
          }
          const { error } = await database.from("people").delete().eq("id", person.id);
          if (error) return setStatus(document.getElementById("person-status"), error.message, true);
          await loadManagerData();
        });
        addRow(peopleRows, person.name, person.description, [edit, remove], person);
      });
      refreshPeopleSelects();
    }

    function renderRelationships() {
      relationshipRows.innerHTML = "";
      if (!relationships.length) {
        relationshipRows.innerHTML = '<div class="empty">还没有关系记录。</div>';
        return;
      }
      relationships.forEach(edge => {
        const a = people.find(person => String(person.id) === String(edge.from_id));
        const b = people.find(person => String(person.id) === String(edge.to_id));
        if (!a || !b) return;
        const kind = ["师徒", "结义", "侠缘"].includes(edge.kind) ? edge.kind : "其他";
        const edit = makeButton("修改", "", () => {
          document.getElementById("relationship-id").value = edge.id;
          document.getElementById("from-person").value = edge.from_id;
          document.getElementById("to-person").value = edge.to_id;
          document.getElementById("relationship-kind").value = kind;
          updateRelationshipFields();
          document.getElementById("label-from").value = edge.label_from || "";
          document.getElementById("label-to").value = edge.label_to || "";
          document.getElementById("relationship-save").textContent = "保存修改";
          document.getElementById("relationship-cancel").classList.remove("hidden");
        });
        const remove = makeButton("删除", "danger", async () => {
          if (!confirm(`要删除“${a.name}”和“${b.name}”之间的关系吗？`)) return;
          const { error } = await database.from("relationships").delete().eq("id", edge.id);
          if (error) return setStatus(document.getElementById("relationship-status"), error.message, true);
          await loadManagerData();
        });
        const note = kind === "师徒" ? `${a.name} 是师傅，${b.name} 是徒弟` :
          kind === "其他" ? `${edge.label_from || "自定义关系"}${edge.label_to ? ` / ${edge.label_to}` : ""}` : kind;
        addRow(relationshipRows, `${a.name} — ${b.name}`, note, [edit, remove], null, kind);
      });
    }

    async function loadManagerData() {
      let [peopleResult, relationshipResult] = await Promise.all([
        database.from("people").select("id,name,description,avatar_path").order("name"),
        database.from("relationships").select("id,from_id,to_id,label_from,label_to,kind").order("created_at")
      ]);
      if (peopleResult.error) {
        const legacyPeopleResult = await database.from("people").select("id,name,description").order("name");
        if (legacyPeopleResult.error) throw legacyPeopleResult.error;
        peopleResult = legacyPeopleResult;
        avatarColumnAvailable = false;
      } else {
        avatarColumnAvailable = true;
      }
      if (relationshipResult.error) {
        const legacyRelationshipResult = await database.from("relationships").select("id,from_id,to_id,label_from,label_to").order("created_at");
        if (legacyRelationshipResult.error) throw legacyRelationshipResult.error;
        relationshipResult = legacyRelationshipResult;
        relationshipKindColumnAvailable = false;
      } else {
        relationshipKindColumnAvailable = true;
      }
      people = peopleResult.data || [];
      relationships = relationshipResult.data || [];
      renderPeople();
      renderRelationships();
    }

    function showManager(session) {
      const signedIn = Boolean(session);
      loginCard.classList.toggle("hidden", signedIn);
      manager.classList.toggle("hidden", !signedIn);
      if (signedIn) loadManagerData().catch(error => setStatus(document.getElementById("relationship-status"), error.message, true));
    }

    if (!config.supabaseUrl || !config.supabasePublishableKey) {
      setStatus(loginStatus, "网站设置没有读到，请刷新管理页面后再试。", true);
      document.getElementById("login-form").querySelector("button").disabled = true;
    } else if (!window.supabase) {
      setStatus(loginStatus, "数据库连接工具没有加载成功，请检查网络后刷新页面。", true);
      document.getElementById("login-form").querySelector("button").disabled = true;
    } else {
      database = window.supabase.createClient(config.supabaseUrl, config.supabasePublishableKey);
      database.auth.getSession().then(({ data }) => showManager(data.session));
      database.auth.onAuthStateChange((_event, session) => showManager(session));
    }

    document.getElementById("login-form").addEventListener("submit", async event => {
      event.preventDefault();
      if (!ready()) return;
      setStatus(loginStatus, "正在登录…");
      const { error } = await database.auth.signInWithPassword({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      });
      setStatus(loginStatus, error ? "登录失败，请检查邮箱和密码。" : "登录成功。", Boolean(error));
    });

    document.getElementById("logout").addEventListener("click", async () => {
      await database.auth.signOut();
      showManager(null);
    });

    const personForm = document.getElementById("person-form");
    function resetPersonAvatar() {
      currentAvatarPath = "";
      selectedAvatarFile = null;
      removeAvatarOnSave = false;
      avatarInput.value = "";
      hideAvatarPreview();
    }

    avatarInput.addEventListener("change", () => {
      const file = avatarInput.files && avatarInput.files[0];
      selectedAvatarFile = file || null;
      removeAvatarOnSave = false;
      if (!file) return showAvatarPreview(currentAvatarPath);
      if (!avatarFileExtension(file)) {
        selectedAvatarFile = null;
        avatarInput.value = "";
        showAvatarPreview(currentAvatarPath);
        return setStatus(document.getElementById("person-status"), "请选择 JPG、PNG 或 WebP 图片。", true);
      }
      if (file.size > maxAvatarSize) {
        selectedAvatarFile = null;
        avatarInput.value = "";
        showAvatarPreview(currentAvatarPath);
        return setStatus(document.getElementById("person-status"), "头像图片不能超过 2 MB。", true);
      }
      showAvatarPreview("", file);
      setStatus(document.getElementById("person-status"), "头像已选好，保存人物后会上传。请记得头像会公开显示。");
    });

    document.getElementById("avatar-clear").addEventListener("click", () => {
      if (selectedAvatarFile) {
        selectedAvatarFile = null;
        avatarInput.value = "";
        removeAvatarOnSave = false;
        showAvatarPreview(currentAvatarPath);
        return setStatus(document.getElementById("person-status"), "已取消新头像。");
      }
      if (currentAvatarPath && !removeAvatarOnSave) {
        removeAvatarOnSave = true;
        hideAvatarPreview();
        return setStatus(document.getElementById("person-status"), "保存修改后会移除当前头像。");
      }
      if (removeAvatarOnSave) {
        removeAvatarOnSave = false;
        showAvatarPreview(currentAvatarPath);
        return setStatus(document.getElementById("person-status"), "已保留当前头像。");
      }
    });

    personForm.addEventListener("submit", async event => {
      event.preventDefault();
      const id = document.getElementById("person-id").value;
      const existing = people.find(person => String(person.id) === String(id));
      const personId = id || crypto.randomUUID();
      const oldAvatarPath = existing && existing.avatar_path || "";
      const values = {
        name: document.getElementById("person-name").value.trim(),
        description: document.getElementById("person-description").value.trim()
      };
      const saveButton = document.getElementById("person-save");
      let uploadedAvatarPath = "";
      let nextAvatarPath = removeAvatarOnSave ? "" : oldAvatarPath;
      saveButton.disabled = true;
      setStatus(document.getElementById("person-status"), "正在保存人物…");
      try {
        if (selectedAvatarFile) {
          if (!avatarColumnAvailable) {
            setStatus(document.getElementById("person-status"), "头像设置还没有完成，请先启用头像存储。", true);
            return;
          }
          const extension = avatarFileExtension(selectedAvatarFile);
          uploadedAvatarPath = `${personId}/${crypto.randomUUID()}.${extension}`;
          const { error: uploadError } = await database.storage.from(avatarBucket).upload(uploadedAvatarPath, selectedAvatarFile, {
            contentType: selectedAvatarFile.type,
            cacheControl: "3600",
            upsert: false
          });
          if (uploadError) {
            uploadedAvatarPath = "";
            setStatus(document.getElementById("person-status"), "暂时无法上传头像，头像存储设置还没有启用。", true);
            return;
          }
          nextAvatarPath = uploadedAvatarPath;
        }

        if (avatarColumnAvailable) values.avatar_path = nextAvatarPath;
        const saveResult = id
          ? await database.from("people").update(values).eq("id", id)
          : await database.from("people").insert({ id: personId, ...values });
        if (saveResult.error) {
          if (uploadedAvatarPath) await database.storage.from(avatarBucket).remove([uploadedAvatarPath]);
          return setStatus(document.getElementById("person-status"), "保存失败，请稍后再试。", true);
        }

        if (oldAvatarPath && oldAvatarPath !== nextAvatarPath) {
          await database.storage.from(avatarBucket).remove([oldAvatarPath]);
        }
        personForm.reset();
        resetPersonAvatar();
        document.getElementById("person-id").value = "";
        document.getElementById("person-save").textContent = "添加人物";
        document.getElementById("person-cancel").classList.add("hidden");
        setStatus(document.getElementById("person-status"), "人物已保存。名册已经更新。");
        await loadManagerData();
      } catch (error) {
        if (uploadedAvatarPath) await database.storage.from(avatarBucket).remove([uploadedAvatarPath]);
        setStatus(document.getElementById("person-status"), "保存失败，请稍后再试。", true);
      } finally {
        saveButton.disabled = false;
      }
    });

    function cancelPersonEdit() {
      personForm.reset();
      resetPersonAvatar();
      document.getElementById("person-id").value = "";
      document.getElementById("person-save").textContent = "添加人物";
      document.getElementById("person-cancel").classList.add("hidden");
    }
    document.getElementById("person-cancel").addEventListener("click", cancelPersonEdit);

    const relationshipForm = document.getElementById("relationship-form");
    document.getElementById("relationship-kind").addEventListener("change", updateRelationshipFields);
    updateRelationshipFields();
    relationshipForm.addEventListener("submit", async event => {
      event.preventDefault();
      const id = document.getElementById("relationship-id").value;
      const fromId = document.getElementById("from-person").value;
      const toId = document.getElementById("to-person").value;
      if (!fromId || !toId || fromId === toId) return setStatus(document.getElementById("relationship-status"), "请选择两个不同的人。", true);
      if (!relationshipKindColumnAvailable) return setStatus(document.getElementById("relationship-status"), "还差一步：请先把“情谊关系类型设置.sql”里的内容复制到 Supabase 的 SQL Editor 并运行，再添加情谊。", true);
      const kind = selectedRelationshipKind();
      const values = {
        from_id: fromId,
        to_id: toId,
        kind,
        label_from: kind === "师徒" ? "师傅" : kind === "其他" ? document.getElementById("label-from").value.trim() : kind,
        label_to: kind === "师徒" ? "徒弟" : kind === "其他" ? document.getElementById("label-to").value.trim() : kind
      };
      const request = id ? database.from("relationships").update(values).eq("id", id) : database.from("relationships").insert(values);
      const { error } = await request;
      if (error) return setStatus(document.getElementById("relationship-status"), "保存失败，请检查数据库设置和两个人的选择。", true);
      relationshipForm.reset();
      document.getElementById("relationship-id").value = "";
      document.getElementById("relationship-save").textContent = "添加关系";
      document.getElementById("relationship-cancel").classList.add("hidden");
      document.getElementById("relationship-kind").value = "";
      updateRelationshipFields();
      setStatus(document.getElementById("relationship-status"), "关系已保存。关系图已经更新。");
      await loadManagerData();
    });

    document.getElementById("relationship-cancel").addEventListener("click", () => {
      relationshipForm.reset();
      document.getElementById("relationship-id").value = "";
      document.getElementById("relationship-save").textContent = "添加关系";
      document.getElementById("relationship-cancel").classList.add("hidden");
      document.getElementById("relationship-kind").value = "";
      updateRelationshipFields();
    });
  </script>
</body>
</html>
